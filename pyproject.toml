[project]
name = "deforestation-monitor"
version = "0.1.0"
description = "Monthly Sentinel-2 forest-loss maps from a U-Net and change detection."
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "NPY"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
